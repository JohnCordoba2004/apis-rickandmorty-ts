<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>apis-rickandmorty-ts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div
      id="app"
      class="mx-auto flex min-h-screen max-w-6xl flex-col px-12 py-12"
    >
      <h1
        class="text-lg sm:text-lg md:text-xl lg:text-4xl text-center font-bold mb-6"
      >
        Rick & Morty
      </h1>
      <!-- Input -->
      <input
        type="text"
        id="buscador"
        placeholder="Busca un personaje (ej: Rick, Morty)..."
        class="w-full max-w-md mx-auto block p-4 mt-4 placeholder:text-slate-900 placeholder:italic placeholder:text-lg rounded-lg border-4 border-slate-900 shadow-sm focus:outline-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 my-10"
      />
      <div
        id="contain-anime"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 my-8"
      >
        <!-- Card -->
      </div>
      <div
        id="paginacion"
        class="mt-auto flex w-full gap-5 justify-center p-2.5 font-bold text-2xl"
      >
        <button
          id="btnPrev"
          class="cursor-pointer border-none flex items-center justify-evenly text-center h-12.5 w-50 bg-[#241744] text-white rounded-[100px] font-[Montserrat] font-semibold transition-all duration-300 ease-[ease] hover:bg-[#137c32] disabled:cursor-not-allowed"
        >
          Anterior
        </button>
        <button
          id="btnNext"
          class="cursor-pointer border-none flex items-center justify-evenly text-center h-12.5 w-50 bg-[#241744] text-white rounded-[100px] font-[Montserrat] font-semibold transition-all duration-300 ease-[ease] hover:bg-[#137c32] disabled:cursor-not-allowed"
        >
          Siguiente
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
